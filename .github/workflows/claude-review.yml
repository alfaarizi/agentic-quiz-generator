name: Claude Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/claude review')
    runs-on: ubuntu-latest
    # pull-requests: write lets the action post the PR review;
    # id-token: write mints the Claude GitHub App token used to authenticate.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Claude Review
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number }} --comment

            Post all findings as one pull request review. Use the GitHub MCP
            pending-review tools: create a pending review, add each inline comment,
            then submit. Do not post through `gh api` or `gh pr comment`, because
            the shell-security checks reject their JSON payloads.
          claude_args: >-
            --model claude-opus-4-6
            --allowedTools
            Read Glob Grep
            mcp__github__pull_request_review_write
            mcp__github__create_pending_pull_request_review
            mcp__github__add_comment_to_pending_review
            mcp__github__submit_pending_pull_request_review
            mcp__github_inline_comment__create_inline_comment
            "Bash(gh pr diff:*)"
            "Bash(gh pr view:*)"
          # display_report writes the review to the run's job summary, so it stays
          # visible even when the inline comments do not post.
          display_report: true

